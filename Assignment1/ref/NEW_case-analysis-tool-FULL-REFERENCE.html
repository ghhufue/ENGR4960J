<!--
  ============================================================================
  CASE ANALYSIS TOOL — FULL REFERENCE BUILD
  ============================================================================
  NOT a student handout. This is an instructor-facing example, built across
  several passes (not one), of what it costs to actually implement every
  design idea from the planning conversation rather than just discuss it.

  See the comment block at the very bottom of the <script> for an honest
  accounting of what came together cleanly vs. what needed real design
  judgment calls that can't be automated away.

  Six things this version adds on top of the plain 10-step skeleton:

  1. AUTHORITY MODE (Socratic / Balanced / Directive) — a "Reflect on this
     answer" button on five prompts across four steps returns a canned
     response whose tone depends on this setting. Heuristic (text
     length / keyword checks), NOT live AI.

  2. ANALYTICAL LENS (Public Safety / Individual Rights / Group Standing) —
     changes the guidance text on four steps. Same case, same 10 steps,
     genuinely different foregrounded questions depending on which lens
     is active — the clearest demonstration that "universal" isn't neutral.

  3. CONTEXT OF USE (Classroom / Pre-Design / Policy / Post-Incident) — a
     second, independent axis from Lens: not "which principle wins" but
     "who is this for and what will they do with it." Changes guidance on
     five steps. A design requirement, a regulatory rule, and a graded
     reflection are different deliverables even from the same case.

  4. CULTURAL CONTEXT, now genuinely interactive on Step 5 — the tool
     scans a student's own Steps 1-4 for four watched terms (loyalty,
     consent, authority/hierarchy, whistleblowing/dissent) and shows a
     card ONLY for terms that actually turned up in that case, each with
     two competing readings and a prompt asking which one the student's
     analysis is quietly leaning on. Still no live AI — CULTURAL_TERM_BANK
     is static, textbook-grounded content, just applied dynamically
     instead of listed generically. The reference screen (sidebar button)
     now shows the same bank as background, so the two can't drift apart.

  5. AI FRAMING ASSIST on the intro screen — an actual live call to the
     Anthropic API (works only when this page is rendered inside
     Claude.ai) that drafts a general ethical frame from a case title.
     Deliberately does NOT try to generate case facts or citations — see
     the comment above requestAiFraming() for why, and the honesty note
     at the bottom for what "the system prompt says not to" can and can't
     guarantee.

  6. STEP 7 GAP DETECTION — Step 7 no longer just recaps Steps 1-6, it
     actively flags likely-overlooked spots: empty fact buckets, an
     unexamined term, missing facts nobody followed up with an
     assumption. Six heuristic checks (empty/short fields, simple word
     overlap), not comprehension — see detectStep7Gaps() and the honesty
     note at the bottom for exactly what that does and doesn't catch.
     Tied to Authority Mode, same as item 1, rather than inventing a
     fifth voice the tool speaks in.

  Settings screen also includes a "save answers locally" toggle with an
  honest note about what this tool does NOT do (detect distress, flag
  concerning answers).
  ============================================================================
-->

  <main class="main" id="main"></main>

<script>
/* ============================================================================
   STEP CONTENT
============================================================================ */

const STEP_DEFS = [
  { n: 1, key: "issues", title: "Identifying Ethical Issues",
    intro: "List the actions in this case that could seriously affect the lives of others. Write each one as a question about what someone should or shouldn't have done. Then name who's actually affected — that list is usually longer than the named characters in the case.",
    prompts: [
      { id: "list", label: "Ethical issues (aim for at least 3–5)", hint: "Phrase each as a question, e.g. \"Should X have done Y?\"", placeholder: "1. Should...\n2. Should...\n3. Should...", reflectable: true },
      { id: "stakeholders", label: "Who could be affected by this — directly or indirectly?", hint: "Include people not named in the case itself: the public, future users, competitors, the environment, whoever inherits the consequences.", placeholder: "1. ...\n2. ...\n3. ...", reflectable: true }
    ] },

  { n: 2, key: "focus", title: "Narrowing the Focus",
    intro: "Full analysis of one issue beats shallow analysis of five. Pick the issue that matters most here.",
    prompts: [
      { id: "chosen", label: "Which issue are you focusing on?", placeholder: "Restate the single question you're narrowing in on." },
      { id: "why", label: "Why this one, over the others?", placeholder: "What makes this the most important or highest-stakes issue in the case?" }
    ] },

  { n: 3, key: "facts", title: "Determining Relevant Facts",
    intro: "Sort what you know into three buckets, then note what's missing.",
    prompts: [
      { id: "material", label: "Material / technical facts", hint: "What went right or wrong with the engineering itself?", placeholder: "..." },
      { id: "individual", label: "Facts about individuals", hint: "What did specific people do or fail to do?", placeholder: "..." },
      { id: "organizational", label: "Facts about organizations", hint: "Policies, incentives, chains of command, culture.", placeholder: "..." },
      { id: "missing", label: "What's missing?", hint: "Facts you wish you had, that would change the analysis.", placeholder: "..." }
    ] },

  { n: 4, key: "assumptions", title: "Making Reasonable Assumptions",
    intro: "You'll never have every fact. Say what you're assuming to fill the gaps, and why the assumption is reasonable rather than convenient.",
    prompts: [ { id: "assumptions", label: "Your assumptions and their justification", placeholder: "I'm assuming ___ because ___." } ] },

  { n: 5, key: "definitions", title: "Undertaking Definitional Clarification",
    intro: "Flag any word you've used so far that someone else might read differently — especially words with a hidden judgment baked in. Below, the tool checks Steps 1–4 for a few terms known to carry different weight across contexts.",
    prompts: [ { id: "terms", label: "Any other ambiguous or value-loaded terms, and how you're using them", hint: "For anything not already covered by the cards above.", placeholder: "\"Harm\" — I'm using this to mean..." } ] },

  { n: 6, key: "analysis", title: "Conducting Ethical Analysis",
    intro: "Which principles apply? If more than one applies and they point in different directions, say which one should win here and why.",
    prompts: [
      { id: "principles", label: "Relevant principles", placeholder: "List the principles that bear on this issue." },
      { id: "conflict", label: "Do any principles conflict?", hint: "If yes, which one takes priority, and is that priority true only for this case or in general?", placeholder: "...", reflectable: true }
    ] },

  { n: 7, key: "review", title: "Reviewing the Process",
    intro: "Look back at everything above. There's no new question to answer here — but before you read back through your own answers, check what the tool below flagged as worth a second look.",
    prompts: [] },

  { n: 8, key: "resolve", title: "Resolving the Issue",
    intro: "Answer the question you posed in Step 2, and justify it.",
    prompts: [
      { id: "resolution", label: "Your resolution", placeholder: "State your answer directly." },
      { id: "justification", label: "Justification", placeholder: "Why is this the right call, given Steps 1–6?", reflectable: true }
    ] },

  { n: 9, key: "constraints", title: "Identifying Practical Constraints",
    intro: "Are there real-world pressures that would make the ideal answer difficult to act on? Naming them isn't the same as excusing them — say which constraints you think are legitimate and which are just convenient.",
    prompts: [ { id: "constraints", label: "Practical constraints", placeholder: "...", reflectable: true } ] },

  { n: 10, key: "avoiding", title: "Avoiding Ethical Problems",
    intro: "Looking back, what earlier decision — made before this issue ever became a crisis — could have prevented it?",
    prompts: [ { id: "avoidance", label: "What could have been done differently, earlier?", placeholder: "List at least two or three points in the case's history where a different choice would have avoided the problem." } ] }
];

/* ============================================================================
   AUTHORITY MODES  —  the "dial" from the design discussion.
   Each mode is a stance toward the user's answer, not just a tone of voice.
============================================================================ */

const AUTHORITY_DEFS = {
  socratic: {
    name: "Socratic",
    desc: "Never evaluates your answer. Only ever responds with a further question, regardless of how thin or strong the answer is."
  },
  balanced: {
    name: "Balanced",
    desc: "Points out where an answer looks incomplete, but leaves the judgment of whether that matters up to you."
  },
  directive: {
    name: "Directive",
    desc: "Will tell you directly when an answer looks weak, evasive, or under-justified — and say why."
  }
};

/* ============================================================================
   ANALYTICAL LENSES — same 10 steps, different foregrounded questions.
   This is the clearest single demonstration that a "universal" tool still
   encodes a value hierarchy — flip the lens and watch the same case get
   read differently.
============================================================================ */

const LENS_DEFS = {
  safety: {
    name: "Public Safety Primacy",
    desc: "Defaults to whichever option most directly prevents physical harm, even at organizational cost.",
    stepNotes: {
      issues: "Start from physical and public safety — what could go wrong that would hurt someone's body, not just their feelings or their budget?",
      facts: "Weight technical/material facts heavily — what do the specs, tolerances, inspection records, or failure data actually say?",
      analysis: "When principles conflict, default to whichever option most directly protects against physical harm.",
      resolve: "Your resolution should be defensible even if it costs the organization money, time, or a contract."
    }
  },
  rights: {
    name: "Individual Rights & Consent",
    desc: "Defaults to whichever option most respects the autonomy and informed consent of the person with the least power.",
    stepNotes: {
      issues: "Start from consent — who was affected by a decision they had no say in?",
      facts: "Pay special attention to facts about individuals — who knew what, and who had the power to act on it?",
      analysis: "When principles conflict, ask which option most respects individual autonomy and informed consent.",
      resolve: "Your resolution should hold up even for the single most powerless person in the case."
    }
  },
  harmony: {
    name: "Group Standing & Relationships",
    desc: "Defaults to whichever option best preserves trust and working relationships between the parties involved.",
    stepNotes: {
      issues: "Start from relationships — whose trust, loyalty, or standing in the group is on the line?",
      facts: "Pay special attention to organizational facts — hierarchy, face-saving, and who reports to whom.",
      analysis: "When principles conflict, ask which option best preserves long-term working relationships and trust.",
      resolve: "Your resolution should account for how each party has to keep working together afterward."
    }
  }
};

/* ============================================================================
   USE CONTEXT — who this analysis is FOR and what they'll do with it.
   Orthogonal to Lens (which principle wins) and Cultural Context (whether
   terms are neutral) — this is about the FUNCTIONAL PURPOSE of the
   analysis, which changes what a good answer even looks like at several
   steps. Classroom is the default because that's what this tool was built
   for; the others exist because the same 10-step structure genuinely gets
   reused for more than grading — a design team, a policy office, and an
   incident review board would all fill these steps out differently.
============================================================================ */

const USE_CONTEXTS = {
  classroom: {
    name: "Classroom Case Analysis",
    desc: "The default. Reasoning is the deliverable — no design or policy recommendation needs to leave this room.",
    stepNotes: {
      issues: "You're being graded on the quality of your reasoning, not on reaching a tidy answer — don't shrink the issue list just to make Step 8 easier later.",
      facts: "Treat missing facts as part of the exercise, not a problem to solve — naming what you'd need to ask for is often more valuable than guessing at it.",
      resolve: "This needs to be defensible to an instructor, not a client or regulator — show the reasoning, not just the conclusion.",
      constraints: "Naming a constraint here is an analytical move, not an excuse — the point is showing you can tell the difference.",
      avoiding: "Instructors often weight this section heavily — it shows you understand prevention, not just diagnosis after the fact."
    }
  },
  predesign: {
    name: "Pre-Design Research",
    desc: "For engineers about to build something in the same space, mining precedent for failure modes before committing to a design.",

      facts: "Prioritize facts about who was affected, who held power, and what oversight existed or didn't — the regulatory gap is usually hiding in the organizational facts.",
      resolve: "This is closer to a rule than a verdict — who should be required to do what, and how would compliance actually be checked?",
      constraints: "Political feasibility, industry pushback, and enforcement capacity are the real constraints here — naming them is the job, not cynicism.",

    }
  },

/* ============================================================================
   CULTURAL TERM BANK — single shared source of truth, used in three places:
     1. Step 5's interactive cards below (scans Steps 1-4 for these terms)
     2. Step 7's gap-check (scans Steps 1-6, flags terms used but unaddressed)
     3. The Cultural Context reference screen (shows all four as background)
   Previously these lived as three separate, drifting lists. Consolidating
   them here means one edit updates all three instead of three edits that
   can silently fall out of sync.

   Each term gets TWO readings, not a single "note." The point isn't "here
   is the correct meaning of loyalty" — it's making the disagreement itself
   the thing a student has to look at and locate their own analysis within.
   "Individual-oriented" / "group-oriented" deliberately reuses the same
   framing as CULTURE_ORIENTATIONS below, rather than inventing a third
   naming scheme — but see that section's own caveat: this is one
   illustrative axis, not the only way any of these terms could diverge.
============================================================================ */

const CULTURAL_TERM_BANK = [
  { id: "loyalty", label: "Loyalty", words: ["loyal"],
    individual: "A personal choice you can revoke — loyalty is earned continuously, and can be withdrawn if the person or organization stops deserving it.",
    group: "An ongoing obligation tied to your role or position — loyalty holds even through disagreement, and withdrawing it is itself a serious act, not a neutral one." },
  { id: "consent", label: "Consent", words: ["consent"],
    individual: "Something a specific person gives or withholds — if they weren't asked directly, consent wasn't obtained, full stop.",
    group: "Something that can be established through a recognized process or a trusted representative — the person may not need to be asked directly if someone with standing to decide for them was." },
  { id: "authority", label: "Authority / Hierarchy", words: ["authorit", "hierarch"],
    individual: "Legitimate only when justified — deferring to someone just because of their position, without an independent reason, can look like a failure of judgment.",
    group: "Legitimate by default, as part of how competent decisions get made — openly questioning it can look less like independence and more like a breakdown of trust in the system." },
  { id: "whistleblowing", label: "Whistleblowing / Dissent", words: ["whistle", "dissent"],
    individual: "A recognized, sometimes celebrated act of conscience — voicing disagreement loudly and individually is how problems get fixed.",
    group: "Usually expected to go through private or indirect channels first — bypassing the group to air disagreement can cost more trust than the original problem, even when the disagreement is right." }
];

function detectCulturalTermsIn(corpus) {
  const lower = (corpus || "").toLowerCase();
  return CULTURAL_TERM_BANK.filter(t => t.words.some(w => lower.includes(w)));
}

// Step 5's own scope: everything a student will typically have written by
// the time they reach it (Steps 1-4). Step 7's gap-check below uses a
// wider scope of its own, since more exists by the time someone's there.
function getDetectedCulturalTerms() {
  const corpus = [
    getResponse("issues", "list"), getResponse("issues", "stakeholders"),
    getResponse("facts", "material"), getResponse("facts", "individual"), getResponse("facts", "organizational"),
    getResponse("assumptions", "assumptions")
  ].join(" ");
  return detectCulturalTermsIn(corpus);
}

// A term counts as "addressed" in Step 5 if a student filled in its
// dedicated card OR mentioned it in the general free-text field — whichever
// they actually used. Step 7's gap-check relies on this so it doesn't nag
// about a term someone already handled through the card.
function culturalTermAnswered(t) {
  const cardAnswer = getResponse("definitions", "cult_" + t.id).trim();
  const generalText = getResponse("definitions", "terms").toLowerCase();
  return cardAnswer.length > 0 || t.words.some(w => generalText.includes(w));
}

/* ============================================================================
   STEP 7 GAP DETECTION — same idea as canned feedback, applied across all
   of Steps 1-6 at once rather than one field at a time. Still heuristic
   (empty/short checks, simple word-overlap) — NOT reading comprehension.
   Tied to Authority Mode for the same reason the per-field feedback is:
   this is another place the tool offers an opinion, and it should use the
   same voice the user already chose in Settings, not a fifth invented one.

   Check F now reads directly from CULTURAL_TERM_BANK (defined above,
   shared with Step 5's cards and the reference screen) rather than its
   own separate word list — see that section's comment for why.
============================================================================ */

function pickByMode(mode, socratic, balanced, directive) {
  if (mode === "socratic") return socratic;
  if (mode === "directive") return directive;
  return balanced;
}

function detectStep7Gaps(mode) {
  const flags = [];

  // Check A — how many issues did Step 1 actually name?
  const issuesText = getResponse("issues", "list").trim();
  const issueLines = issuesText.split(/\n+/).filter(l => l.trim().length > 0);
  if (issuesText.length === 0) {
    flags.push(pickByMode(mode,
      "Is there a reason Step 1 is still empty?",
      "Step 1 (Identifying Ethical Issues) is empty.",
      "Step 1 is empty — go back and list at least three issues before continuing."));
  } else if (issueLines.length < 3) {
    flags.push(pickByMode(mode,
      "Step 1 lists " + issueLines.length + " issue(s) — is that genuinely all that's at stake, or the easiest ones to see?",
      "Step 1 lists " + issueLines.length + " issue(s), fewer than the three to five the book suggests aiming for.",
      "Step 1 only has " + issueLines.length + " issue(s) — go back and look for at least two more before moving on."));
  }

  // Check B — did one of Step 3's three fact buckets get skipped?
  const buckets = ["material", "individual", "organizational"];
  const filledBuckets = buckets.filter(b => getResponse("facts", b).trim().length > 0);
  const emptyBuckets = buckets.filter(b => getResponse("facts", b).trim().length === 0);
  if (filledBuckets.length > 0 && emptyBuckets.length > 0) {
    flags.push(pickByMode(mode,
      "Step 3 has nothing under " + emptyBuckets.join(" or ") + " — is that because it genuinely doesn't apply, or because it's the easiest bucket to skip?",
      "Step 3's " + emptyBuckets.join(" and ") + " field(s) are empty while the others aren't.",
      "Go back and fill in Step 3's " + emptyBuckets.join(" and ") + " — an empty fact category is one of the most common shortcuts taken in this step."));
  }

  // Check C — "what's missing" left blank
  if (getResponse("facts", "missing").trim().length === 0) {
    flags.push(pickByMode(mode,
      "Real cases almost always have facts you wish you had — have you actually looked for what's missing here, or just left the field blank?",
      "Step 3's \"What's missing?\" field is empty.",
      "Fill in Step 3's \"What's missing?\" field — leaving it blank usually means it wasn't actually checked."));
  }

  // Check D — Step 3 named gaps, but Step 4 never addressed them
  const missingFacts = getResponse("facts", "missing").trim();
  const assumptions = getResponse("assumptions", "assumptions").trim();
  if (missingFacts.length > 0 && assumptions.length === 0) {
    flags.push(pickByMode(mode,
      "Step 3 named facts you don't have — what are you assuming to fill those specific gaps?",
      "Step 3 named missing facts, but Step 4 (Making Reasonable Assumptions) is empty.",
      "Go fill in Step 4 — Step 3 already named the gaps, and Step 4 exists specifically to state what you're assuming about them."));
  }

  // Check E — Step 6's conflict question left thin
  const conflictText = getResponse("analysis", "conflict").trim();
  if (conflictText.length < 15) {
    flags.push(pickByMode(mode,
      "If a colleague ranked your Step 6 principles in the opposite order, what would they be responding to that you aren't?",
      "Step 6's \"do any principles conflict\" question is empty or very short.",
      "Go back to Step 6 — \"do any principles conflict\" needs a real answer, not a blank field or a one-line dismissal."));
  }

  // Check F — value-loaded words used earlier but never addressed in Step 5
  // (through either the dedicated cultural-term cards or the general field)
  const earlyText = [
    getResponse("issues", "list"), getResponse("issues", "stakeholders"), getResponse("facts", "material"), getResponse("facts", "individual"),
    getResponse("facts", "organizational"), getResponse("analysis", "principles"), getResponse("analysis", "conflict")
  ].join(" ").toLowerCase();
  const usedButUnaddressed = CULTURAL_TERM_BANK.filter(t => t.words.some(w => earlyText.includes(w)) && !culturalTermAnswered(t));
  const labels = usedButUnaddressed.map(t => t.label);
  if (labels.length > 0) {
    flags.push(pickByMode(mode,
      "You've used the term \"" + labels[0] + "\" earlier without addressing it in Step 5 — would every reader understand it exactly the way you mean it?",
      "\"" + labels.join(", ") + "\" shows up in your earlier answers but isn't addressed in Step 5.",
      "Go back to Step 5 and address \"" + labels.join(", ") + "\" — these terms showed up earlier but were never pinned down."));
  }

  return flags;
}

/* ============================================================================
   CANNED FEEDBACK — heuristic, not AI. Text-length / keyword checks only.
   See the honesty note at the bottom of this file for why that matters.
============================================================================ */

function getCannedFeedback(stepKey, promptId, text, mode) {
  const trimmed = (text || "").trim();
  const isEmpty = trimmed.length === 0;
  const isThin = trimmed.length > 0 && trimmed.length < 40;
  const lineCount = trimmed.split(/\n+/).filter(l => l.trim().length > 0).length;
  // Loose check for whether the answer reaches beyond the case's named
  // characters to more diffuse or indirect parties. Substring match on a
  // short word list — same shallow-but-honest approach as everywhere else
  // in this file, not real comprehension of who's actually affected.
  const broadWords = ["public", "environment", "future", "communit", "societ", "user", "regulat", "compet", "generation"];
  const mentionsBroad = broadWords.some(w => trimmed.toLowerCase().includes(w));

  const bank = {
    "issues.list": {
      socratic: "Who else, besides the people already named, might be affected by this — even indirectly?",
      balanced: isEmpty ? "This is empty — is that because nothing else is at stake, or because it hasn't been looked for yet?"
               : (lineCount < 2 ? "Only one issue listed so far — is that really the only one, or the easiest one to see?" : "A reasonable spread of issues. Do any of them share a root cause?"),
      directive: isEmpty ? "You haven't listed anything. Go back to the case text and find at least three actions that could seriously affect someone."
               : (lineCount < 3 ? "You've named " + lineCount + " issue(s). The book expects at least three to five — what else is at stake here, for people not front-and-center in the story?" : "Good spread. Now check: are any of these actually the same issue phrased twice?")
    },
    "issues.stakeholders": {
      socratic: "Who's affected by this that isn't named anywhere in the case itself?",
      balanced: isEmpty ? "This is empty — have you looked past the people actually named in the case?"
               : (mentionsBroad ? "This reaches beyond the named parties, which is good — is there anyone even further removed who's still affected?" : "Everyone listed here looks like they're named directly in the case. Is there anyone affected indirectly — the public, future users, the environment?"),
      directive: isEmpty ? "You haven't named any stakeholders. Go back to the case and list who's touched by it, including people never mentioned by name."
               : (mentionsBroad ? "This goes beyond just the named parties — good. Push one step further: who's affected somewhere else, or years from now?" : "You've only listed people named directly in the case. That's the easy list — go back and add at least one indirect or systemic stakeholder: the public, future users, the environment, a competitor.")
    },
    "analysis.conflict": {
      socratic: "If a colleague ranked these principles in the opposite order, what would they be responding to that you aren't?",
      balanced: isEmpty ? "You haven't said whether these principles conflict — have you checked?" : "Have you said which principle wins, or just that they might conflict?",
      directive: isEmpty ? "You haven't addressed conflict at all. In most real cases the principles DO pull in different directions — look again before moving on."
               : (isThin ? "This is thin. Naming that principles conflict isn't the analysis — which one wins, and why, is." : "You've named a conflict and a resolution. Is your reason for the ranking specific to this case, or would you apply it in general?")
    },
    "resolve.justification": {
      socratic: "What would change your mind here?",
      balanced: isThin || isEmpty ? "What's the strongest argument against your own resolution?" : "You've given a justification — does it rely on any assumption from Step 4 that could be wrong?",
      directive: isEmpty ? "There's no justification here yet. A resolution without a justification is just an opinion."
               : (isThin ? "A one-line justification usually means an unexamined assumption is hiding underneath it. What's the strongest argument against your own resolution?" : "This holds together. Now stress-test it: what fact, if it turned out to be false, would break this justification?")
    },
    "constraints.constraints": {
      socratic: "Who would find this constraint most convincing, and who would find it least convincing?",
      balanced: isEmpty ? "Are there really no practical constraints here, or have they not been considered yet?" : "Is this constraint a real barrier, or a convenient one?",
      directive: isEmpty ? "You've listed no constraints. That's rare in a real case — is the ideal resolution actually free of institutional pressure here?"
               : "Would this constraint survive being said out loud to the person it excuses harming? If not, it's probably not a legitimate excuse."
    }
  };

  const key = stepKey + "." + promptId;
  const entry = bank[key];
  if (!entry) return "No canned feedback is written for this field yet — this is a good one for your group to write.";
  return entry[mode] || entry.balanced;
}

/* ============================================================================
   CORE SHELL
============================================================================ */

const STORAGE_KEY = "case_analysis_tool_full_v1";
const SCREEN_SETTINGS = -1;
const SCREEN_CULTURE = -2;
const SCREEN_INTRO = 0;
const SCREEN_SUMMARY = STEP_DEFS.length + 1;

function isAuxScreen(s) { return s === SCREEN_SETTINGS || s === SCREEN_CULTURE; }
function backTarget() { return state.previousScreen != null ? state.previousScreen : SCREEN_INTRO; }

// Always returns a brand-new object with its own fresh `responses` object —
// used both for first load and for reset, so a reset can never accidentally
// share (and later mutate) a nested object from a previous session.
function freshState() {
  return {
    caseTitle: "", caseDescription: "",
    responses: {}, reflection: "",
    authorityMode: "balanced", lens: "none", useContext: "classroom", saveLocally: true,
    currentScreen: SCREEN_INTRO, previousScreen: SCREEN_INTRO
  };
}

// Merge any saved state ON TOP of a fresh default shape — this is what
// protects against a saved session from an earlier version of this file
// (missing fields like useContext, which didn't exist yet) crashing on load.
let state = Object.assign(freshState(), loadState() || {});

function loadState() {
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { console.warn("Could not load saved state:", e); return null; }
}

function saveState() {
  if (state.saveLocally === false) return; // honors the settings toggle
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { console.warn("Could not save state:", e); }
}

function getResponse(stepKey, promptId) { return (state.responses[stepKey] && state.responses[stepKey][promptId]) || ""; }
function setResponse(stepKey, promptId, value) {
  if (!state.responses[stepKey]) state.responses[stepKey] = {};
  state.responses[stepKey][promptId] = value;
  saveState();
}
function stepHasContent(stepDef) {
  const answers = state.responses[stepDef.key];
  if (!answers) return false;
  return Object.values(answers).some(v => v && v.trim().length > 0);
}

function goTo(screen) {
  if (isAuxScreen(screen) && !isAuxScreen(state.currentScreen)) {
    state.previousScreen = state.currentScreen; // so both aux screens' Back buttons return to real content
  }
  state.currentScreen = screen;
  saveState();
  render();
  window.scrollTo(0, 0);
}

function resetAll() {
  if (!confirm("This clears the case, every step's answers, and your settings. This can't be undone. Continue?")) return;
  state = freshState();
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  render();
}

function exportAnalysis() {
  const lines = [];
  lines.push("CASE ANALYSIS");
  lines.push("=".repeat(60));
  lines.push("Case: " + (state.caseTitle || "(untitled)"));
  if (state.caseDescription) { lines.push(""); lines.push(state.caseDescription); }
  lines.push("");
  lines.push("Tool configuration when this was written:");
  lines.push("  Use context: " + USE_CONTEXTS[state.useContext].name);
  lines.push("  Authority mode: " + AUTHORITY_DEFS[state.authorityMode].name);
  lines.push("  Analytical lens: " + (state.lens === "none" ? "None selected" : LENS_DEFS[state.lens].name));
  lines.push("");

  STEP_DEFS.forEach(step => {
    lines.push("-".repeat(60));
    lines.push(`STEP ${step.n} — ${step.title.toUpperCase()}`);
    lines.push("-".repeat(60));
    if (step.prompts.length === 0) { lines.push("(review step — no separate entry)"); }
    else {
      step.prompts.forEach(p => {
        lines.push(""); lines.push(p.label + ":");
        lines.push(getResponse(step.key, p.id) || "(no answer)");
      });
    }
    if (step.key === "definitions") {
      const detected = getDetectedCulturalTerms();
      if (detected.length > 0) {
        lines.push("");
        lines.push("Cultural term reflections (auto-detected from Steps 1-4):");
        detected.forEach(t => {
          lines.push("");
          lines.push("  " + t.label + ":");
          lines.push("    Reading A (individual-oriented): " + t.individual);
          lines.push("    Reading B (group-oriented): " + t.group);
          lines.push("    Your reflection: " + (getResponse("definitions", "cult_" + t.id) || "(no answer)"));
        });
      }
    }
    lines.push("");
  });

  lines.push("-".repeat(60));
  lines.push("FRAMEWORK REFLECTION");
  lines.push("-".repeat(60));
  lines.push(state.reflection || "(no answer)");

  const blob = new Blob([lines.join("\n")], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const safeName = (state.caseTitle || "case-analysis").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  a.download = safeName + ".txt";
  a.click();
  URL.revokeObjectURL(url);
}

function escapeHtml(str) {
  if (str == null) return "";
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* ---------------------------------------------------------------- */
/* Rendering                                                          */
/* ---------------------------------------------------------------- */

function render() { renderSidebar(); renderMain(); }

function renderSidebar() {
  const sidebar = document.getElementById("sidebar");
  const caseNameHtml = state.caseTitle ? `<div class="case-name">${escapeHtml(state.caseTitle)}</div>` : `<div class="case-name placeholder">Untitled case</div>`;
  const lensLabel = state.lens === "none" ? "no lens" : LENS_DEFS[state.lens].name.toLowerCase();
  const contextLabel = USE_CONTEXTS[state.useContext].name.toLowerCase();
  const configHtml = `<div class="config-line">${escapeHtml(contextLabel)} · ${AUTHORITY_DEFS[state.authorityMode].name.toLowerCase()} mode · <strong>${escapeHtml(lensLabel)}</strong></div>`;

  let stepsHtml = "";
  STEP_DEFS.forEach(step => {
    const isActive = state.currentScreen === step.n;
    const isDone = stepHasContent(step);
    stepsHtml += `
      <li class="step-item ${isActive ? "active" : ""} ${isDone ? "done" : ""}">
        <span class="step-dot"></span>
        <button class="step-btn" onclick="goTo(${step.n})">
          <span class="step-num">${String(step.n).padStart(2, "0")}</span>${escapeHtml(step.title)}
        </button>
      </li>`;
  });

  sidebar.innerHTML = `
    <div class="brand">CASE ANALYSIS TOOL</div>
    ${caseNameHtml}
    ${configHtml}
    <ul class="step-list">${stepsHtml}</ul>
    <div class="sidebar-foot">
      <button class="ghost-btn highlight" onclick="goTo(${SCREEN_SETTINGS})">⚙ Tool settings</button>
      <button class="ghost-btn highlight" onclick="goTo(${SCREEN_CULTURE})">Cultural context</button>
      <button class="ghost-btn" onclick="goTo(${SCREEN_SUMMARY})">Review &amp; export →</button>
      <button class="ghost-btn" onclick="resetAll()">Reset everything</button>
    </div>
  `;
}

function renderMain() {
  const main = document.getElementById("main");
  if (state.currentScreen === SCREEN_SETTINGS) { main.innerHTML = renderSettingsScreen(); bindSettingsScreen(); return; }
  if (state.currentScreen === SCREEN_CULTURE) { main.innerHTML = renderCultureScreen(); bindCultureScreen(); return; }
  if (state.currentScreen === SCREEN_INTRO) { main.innerHTML = renderIntroScreen(); bindIntroScreen(); return; }
  if (state.currentScreen === SCREEN_SUMMARY) { main.innerHTML = renderSummaryScreen(); bindSummaryScreen(); return; }
  const step = STEP_DEFS.find(s => s.n === state.currentScreen);
  if (!step) { goTo(SCREEN_INTRO); return; }
  main.innerHTML = renderStepScreen(step);
  bindStepScreen(step);
}

function renderSettingsScreen() {
  const authorityCards = Object.entries(AUTHORITY_DEFS).map(([id, def]) => `
    <button class="option-card ${state.authorityMode === id ? "selected" : ""}" onclick="setAuthorityMode('${id}')">
      <div class="option-card-title">${escapeHtml(def.name)}</div>
      <div class="option-card-desc">${escapeHtml(def.desc)}</div>
    </button>`).join("");

  const lensCards = `
    <button class="option-card ${state.lens === "none" ? "selected" : ""}" onclick="setLens('none')">
      <div class="option-card-title">None</div>
      <div class="option-card-desc">Generic guidance only — no value framework is foregrounded.</div>
    </button>` +
    Object.entries(LENS_DEFS).map(([id, def]) => `
    <button class="option-card ${state.lens === id ? "selected" : ""}" onclick="setLens('${id}')">
      <div class="option-card-title">${escapeHtml(def.name)}</div>
      <div class="option-card-desc">${escapeHtml(def.desc)}</div>
    </button>`).join("");

  const contextCards = Object.entries(USE_CONTEXTS).map(([id, def]) => `
    <button class="option-card ${state.useContext === id ? "selected" : ""}" onclick="setUseContext('${id}')">
      <div class="option-card-title">${escapeHtml(def.name)}</div>
      <div class="option-card-desc">${escapeHtml(def.desc)}</div>
    </button>`).join("");

  return `
    <div class="step-meta">TOOL SETTINGS</div>
    <h1 class="step-title">How should this tool behave?</h1>
    <p class="step-intro">These aren't preferences — they're the ethical design decisions your group needs to be able to defend. Nothing here is a "correct" default. Switch settings anytime; your saved answers won't change.</p>

    <div class="settings-group">
      <div class="settings-group-label">AUTHORITY MODE</div>
      <p class="settings-group-sub">Controls whether the tool ever tells you your reasoning is weak, or only ever asks another question.</p>
      ${authorityCards}
    </div>

    <div class="settings-group">
      <div class="settings-group-label">ANALYTICAL LENS</div>
      <p class="settings-group-sub">Changes which questions get foregrounded at four of the ten steps. The case and the ten steps stay identical — only what the tool tells you to pay attention to changes.</p>
      ${lensCards}
    </div>

    <div class="settings-group">
      <div class="settings-group-label">CONTEXT OF USE</div>
      <p class="settings-group-sub">Who is this analysis actually for, and what will they do with it? A design requirement, a regulatory rule, and a graded reflection aren't the same deliverable, even starting from the same case — this changes the guidance at five steps.</p>
      ${contextCards}
    </div>

    <div class="settings-group">
      <div class="settings-group-label">DATA</div>
      <p class="settings-group-sub">Whether your answers are saved in this browser between visits.</p>
      <label class="toggle-row">
        <input type="checkbox" id="save-locally-toggle" ${state.saveLocally ? "checked" : ""}>
        Save my answers in this browser (localStorage — nothing leaves your device)
      </label>
      <div class="honest-note">
        <strong>What this tool does not do:</strong> it does not read your answers for signs of distress, and it
        does not flag or escalate anything you write, in any mode. A version of this tool that tried to do that
        with simple keyword matching would likely be worse than doing nothing — false alarms and missed real
        ones are both easy to produce that way. If your group's version of this tool asks more personal
        reflective questions than this one does, that's a design decision to make deliberately, with a real
        human escalation path, not a feature to bolt on with a string match.
      </div>
    </div>

    <div class="nav-row">
      <button class="secondary" onclick="goTo(${backTarget()})">← Back</button>
      <span></span>
    </div>
  `;
}

function bindSettingsScreen() {
  document.getElementById("save-locally-toggle").addEventListener("change", e => {
    state.saveLocally = e.target.checked;
    if (state.saveLocally) saveState();
  });
}

/* ============================================================================
   CULTURAL CONTEXT — static, textbook-grounded, no live AI call.
   ----------------------------------------------------------------------------
   Deliberately NOT folded into the Lens system above: a lens is about which
   PRINCIPLE wins when they conflict (Step 6). This is about whether the
   TERMS you're using (Step 5) carry the same connotation for every reader.
   Those are different questions and conflating them would blur exactly the
   distinction the book draws between "conducting ethical analysis" and
   "undertaking definitional clarification."

   This is one illustrative comparison (drawn from the assigned textbook's
   own discussion of cross-cultural values), not a claim to cover "culture"
   in general — the UI says so explicitly, and groups are pointed toward
   adding their own comparison if their case needs one this doesn't cover.
============================================================================ */

const CULTURE_ORIENTATIONS = {
  groupPole: ["harmony", "hierarchy", "consensus", "duty", "conformity", "loyalty"],
  individualPole: ["rights", "freedom", "equality", "independence", "choice"]
};

function renderCultureScreen() {
  const termCards = CULTURAL_TERM_BANK.map(t => `
    <div class="cult-card">
      <div class="cult-card-title">${escapeHtml(t.label)}</div>
      <div class="cult-readings">
        <div class="cult-reading"><div class="cult-reading-label">READING A — INDIVIDUAL-ORIENTED</div>${escapeHtml(t.individual)}</div>
        <div class="cult-reading"><div class="cult-reading-label">READING B — GROUP-ORIENTED</div>${escapeHtml(t.group)}</div>
      </div>
    </div>`).join("");

  return `
    <div class="step-meta">REFERENCE</div>
    <h1 class="step-title">Cultural context</h1>
    <p class="step-intro">Ethics isn't relative — but the words used to talk about it aren't neutral either. The same term can carry different weight depending on cultural context, which is exactly why Step 5 (Definitional Clarification) exists as its own step rather than being folded into Step 6. Step 5 itself now surfaces these same four terms interactively, scoped to whatever's actually in your own answers — this page is the general background behind that, useful on its own if you want the fuller picture.</p>

    <div class="settings-group">
      <div class="settings-group-label">ONE COMPARISON THE TEXTBOOK MAKES</div>
      <p class="settings-group-sub">Not a complete map of cultural variation — one illustrative pairing. If your case involves a cultural context this doesn't cover, add your own comparison rather than treating this as exhaustive.</p>
      <div class="culture-table">
        <div class="culture-col">
          <div class="culture-col-title">More group-oriented emphasis</div>
          <div class="culture-tags">${CULTURE_ORIENTATIONS.groupPole.map(w => `<span class="culture-tag">${escapeHtml(w)}</span>`).join("")}</div>
        </div>
        <div class="culture-col">
          <div class="culture-col-title">More individual-oriented emphasis</div>
          <div class="culture-tags">${CULTURE_ORIENTATIONS.individualPole.map(w => `<span class="culture-tag">${escapeHtml(w)}</span>`).join("")}</div>
        </div>
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-group-label">TERMS WORTH DOUBLE-CHECKING</div>
      <p class="settings-group-sub">The same four terms Step 5 watches for, shown here as general background — each can genuinely be read at least two real ways, not just the two shown.</p>
      ${termCards}
    </div>

    <div class="nav-row">
      <button class="secondary" onclick="goTo(${backTarget()})">← Back</button>
      <span></span>
    </div>
  `;
}

function bindCultureScreen() { /* static content — nothing to bind */ }

function setAuthorityMode(id) { state.authorityMode = id; saveState(); render(); }
function setLens(id) { state.lens = id; saveState(); render(); }
function setUseContext(id) { state.useContext = id; saveState(); render(); }

function renderIntroScreen() {
  return `
    <div class="step-meta">START HERE</div>
    <h1 class="step-title">Name the case you're analyzing</h1>
    <p class="step-intro">This can be a real case, a hypothetical, or one your group wrote. You can change this later, and you can set an authority mode and lens from Tool Settings in the sidebar whenever you like.</p>

    <div class="prompt-block">
      <label class="prompt-label" for="case-title-input">Case title</label>

/* ============================================================================
   AI FRAMING ASSIST
   ----------------------------------------------------------------------------
   Deliberately narrow in scope. It does NOT try to write "the case
   description" from a title alone — that's exactly the shape of feature
   most likely to produce confident, plausible-sounding, WRONG facts about
   a real event (dates, numbers, outcomes) with nothing in this file able
   to check them. Instead it drafts a general ethical FRAME (what kind of
   tension this looks like) and points to textbook THEMES, not invented
   external citations. The system prompt below is the actual guardrail —
   read it if you're deciding whether this is safe enough for your context.

   This only works when the file is rendered inside Claude.ai, which
   injects the API credentials. Opened as a local file or hosted elsewhere
   (Replit, GitHub Pages, etc.), the fetch will fail — the catch block
   below handles that as an expected case, not a crash.
============================================================================ */

let lastAiSuggestion = null;

async function requestAiFraming() {
  const btn = document.getElementById("ai-assist-btn");
  const box = document.getElementById("ai-suggestion-box");
  const titleVal = document.getElementById("case-title-input").value.trim();
  const descVal = document.getElementById("case-desc-input").value.trim();

  if (!titleVal) {
    box.style.display = "block";
    box.innerHTML = `<p class="ai-suggestion-note">Add a case title first.</p>`;
    return;
  }

  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Thinking…";
  box.style.display = "block";
  box.innerHTML = `<p class="ai-suggestion-note">Contacting the model…</p>`;

  const systemPrompt = "You are helping an engineering ethics instructor rough out a STARTING POINT for a case-analysis tool used by senior engineering students. Given a case title and an optional existing description, respond with: (1) a short 3-5 sentence FRAME (not a full narrative) naming what kind of ethical tension this likely involves (e.g. conflicting duties, safety vs. cost, whistleblowing, cross-cultural friction) — general enough to be useful even without reliable specifics; (2) if the title suggests a real event, say so plainly and do NOT invent specific facts (dates, casualty counts, financial figures, outcomes) you are not certain of — tell the user to verify and add real details themselves instead; (3) one sentence naming which theme(s), chosen ONLY from this list, connect most closely: professionalism and codes of ethics; basic principles of safety, human rights, environmental protection, competence, and truthful disclosure; the prime responsibility of safety; the global business environment; cross-cultural values; personal and professional autonomy; conflicting duties and whistleblowing; broader public responsibilities and the law; the rights of engineers. Do not invent external citations, authors, or sources. Do not resolve the ethical question — this is a framing aid only. Keep the entire response under 150 words.";

  const userMessage = "Case title: " + titleVal + "\n\nExisting description (may be empty): " + (descVal || "(nothing written yet)");

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [ { role: "user", content: userMessage } ]
      })
    });
    const data = await response.json();
    const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
    if (!text) throw new Error("Empty response from model");

    lastAiSuggestion = text;
    box.innerHTML = `
      <p class="ai-suggestion-label">AI-drafted framing — verify before treating anything here as fact:</p>
      <p class="ai-suggestion-text">${escapeHtml(text)}</p>
      <button class="reflect-btn" onclick="acceptAiSuggestion()">Insert into description</button>
    `;
  } catch (err) {
    box.innerHTML = `<p class="ai-suggestion-note">AI assist isn't available right now — this only works when this page is running inside Claude.ai. You can still write the framing directly in the field above.</p>`;
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

function acceptAiSuggestion() {
  if (!lastAiSuggestion) return;
  const ta = document.getElementById("case-desc-input");
  const existing = ta.value.trim();
  ta.value = existing ? existing + "\n\n" + lastAiSuggestion : lastAiSuggestion;
  state.caseDescription = ta.value;
  saveState();
  document.getElementById("ai-suggestion-box").style.display = "none";
}

function renderCultTermCard(t) {
  const promptKey = "cult_" + t.id;
  const reflectPrompt = pickByMode(state.authorityMode,
    "Which of these two readings does your analysis lean on, even if you haven't said so? What would change if you leaned on the other one instead?",
    "Your analysis probably assumes one of these readings without stating it. Which one, and does saying that out loud change anything?",
    "Go check: which of these two readings are you actually using? If you can't tell, this term isn't pinned down yet.");
  return `
    <div class="cult-card">
      <div class="cult-card-title">${escapeHtml(t.label)}</div>
      <div class="cult-readings">
        <div class="cult-reading"><div class="cult-reading-label">READING A — INDIVIDUAL-ORIENTED</div>${escapeHtml(t.individual)}</div>
        <div class="cult-reading"><div class="cult-reading-label">READING B — GROUP-ORIENTED</div>${escapeHtml(t.group)}</div>
      </div>
      <label class="prompt-label" for="p-definitions-${promptKey}">${escapeHtml(reflectPrompt)}</label>
      <textarea id="p-definitions-${promptKey}" placeholder="...">${escapeHtml(getResponse("definitions", promptKey))}</textarea>
    </div>`;
}

function renderStepScreen(step) {
  let contextNoteHtml = "";
  const ctxNote = USE_CONTEXTS[state.useContext].stepNotes[step.key];
  if (ctxNote) contextNoteHtml = `<div class="lens-note context-note"><strong>${escapeHtml(USE_CONTEXTS[state.useContext].name.toUpperCase())}</strong>${escapeHtml(ctxNote)}</div>`;

  let lensNoteHtml = "";
  if (state.lens !== "none") {
    const note = LENS_DEFS[state.lens].stepNotes[step.key];
    if (note) lensNoteHtml = `<div class="lens-note"><strong>${escapeHtml(LENS_DEFS[state.lens].name.toUpperCase())} LENS</strong>${escapeHtml(note)}</div>`;
  }

  let culturalCardsHtml = "";
  if (step.key === "definitions") {
    const detected = getDetectedCulturalTerms();
    if (detected.length > 0) {
      culturalCardsHtml = `
        <div class="cult-section">
          <div class="cult-section-header">TERMS FROM YOUR OWN ANSWERS, WORTH A SECOND READING</div>
          <p class="prompt-hint">These showed up somewhere in Steps 1–4. Each can genuinely be read at least two real ways — which is your analysis quietly assuming? <button class="inline-link" onclick="goTo(${SCREEN_CULTURE})">General background →</button></p>
          ${detected.map(renderCultTermCard).join("")}
        </div>`;
    } else {
      culturalCardsHtml = `
        <div class="cult-section">
          <div class="cult-section-header">NO WATCHED TERMS DETECTED YET</div>
          <p class="prompt-hint">This tool watches Steps 1–4 for loyalty, consent, authority/hierarchy, and whistleblowing/dissent — none showed up. That doesn't mean your case is free of culturally loaded language, just that it's not one of the four this tool has pre-written readings for. Use the field below for anything you've noticed yourself, and see the <button class="inline-link" onclick="goTo(${SCREEN_CULTURE})">reference page</button> for general background.</p>
        </div>`;
    }
  }

  let promptsHtml = step.prompts.map(p => {
    const reflectHtml = p.reflectable
      ? `<div class="reflect-row">
           <button class="reflect-btn" onclick="reflectOnAnswer('${step.key}','${p.id}', this)">Reflect on this answer</button>
           <div class="feedback-note"></div>
         </div>`
      : "";
    return `
    <div class="prompt-block">
      <label class="prompt-label" for="p-${step.key}-${p.id}">${escapeHtml(p.label)}</label>
      ${p.hint ? `<p class="prompt-hint">${escapeHtml(p.hint)}</p>` : ""}
      <textarea id="p-${step.key}-${p.id}" placeholder="${escapeHtml(p.placeholder || "")}">${escapeHtml(getResponse(step.key, p.id))}</textarea>
      ${reflectHtml}
    </div>`;
  }).join("");

  let recapHtml = "";
  if (step.key === "review") {
    const gapFlags = detectStep7Gaps(state.authorityMode);
    const gapBody = gapFlags.length === 0
      ? `<p class="gap-clean">No structural gaps detected — that's not the same as a strong analysis, just that nothing obvious is missing by these simple checks. Use the recap below to look for yourself.</p>`
      : `<ul class="gap-list">${gapFlags.map(f => `<li>${escapeHtml(f)}</li>`).join("")}</ul>`;
    recapHtml += `
      <div class="gap-panel">
        <div class="gap-panel-header">WORTH A SECOND LOOK <span class="gap-mode-tag">(${escapeHtml(AUTHORITY_DEFS[state.authorityMode].name)} mode)</span></div>
        ${gapBody}
        <p class="gap-disclaimer">These are simple checks — empty fields, short answers, word overlap — not real reading comprehension. A field that's filled in can still be filled in badly, and this won't catch that.</p>
      </div>`;
    recapHtml += STEP_DEFS.filter(s => s.n < step.n && s.prompts.length > 0).map(s => {
      const answers = s.prompts.map(p => {
        const val = getResponse(s.key, p.id);
        return `<p class="recap-answer ${val ? "" : "empty"}"><strong>${escapeHtml(p.label)}:</strong> ${escapeHtml(val || "(not answered yet)")}</p>`;
      }).join("");
      return `<div class="recap"><div class="recap-step">STEP ${s.n} — ${escapeHtml(s.title)}</div>${answers}</div>`;
    }).join("");
  }

  const isLast = step.n === STEP_DEFS.length;

  return `
    <div class="step-meta">STEP ${String(step.n).padStart(2, "0")} OF ${STEP_DEFS.length}</div>
    <h1 class="step-title">${escapeHtml(step.title)}</h1>
    <p class="step-intro">${escapeHtml(step.intro)}</p>
    ${contextNoteHtml}
    ${lensNoteHtml}
    ${culturalCardsHtml}
    ${recapHtml}
    ${promptsHtml}
    <div class="nav-row">
      <button class="secondary" onclick="goTo(${step.n - 1})">← Back</button>
      <button class="primary" onclick="goTo(${isLast ? SCREEN_SUMMARY : step.n + 1})">${isLast ? "Review & export →" : "Next →"}</button>
    </div>
  `;
}

function bindStepScreen(step) {
  step.prompts.forEach(p => {
    const el = document.getElementById(`p-${step.key}-${p.id}`);
    if (!el) return;
    el.addEventListener("input", e => { setResponse(step.key, p.id, e.target.value); renderSidebar(); });
  });

  if (step.key === "definitions") {
    getDetectedCulturalTerms().forEach(t => {
      const promptKey = "cult_" + t.id;
      const el = document.getElementById(`p-definitions-${promptKey}`);
      if (!el) return;
      el.addEventListener("input", e => { setResponse("definitions", promptKey, e.target.value); renderSidebar(); });
    });
  }
}

function reflectOnAnswer(stepKey, promptId, btnEl) {
  const ta = document.getElementById(`p-${stepKey}-${promptId}`);
  const text = ta ? ta.value : "";
  const feedback = getCannedFeedback(stepKey, promptId, text, state.authorityMode);
  const note = btnEl.nextElementSibling;
  note.textContent = feedback;
  note.style.display = "block";
}

function renderSummaryScreen() {
  const blocks = STEP_DEFS.map(step => {
    let answers = "";
    if (step.prompts.length > 0) {
      answers += step.prompts.map(p => {
        const val = getResponse(step.key, p.id);
        return `<div class="summary-title">${escapeHtml(p.label)}</div><p class="summary-body ${val ? "" : "empty"}">${escapeHtml(val || "Not answered yet.")}</p>`;
      }).join("");
    }
    if (step.key === "definitions") {
      getDetectedCulturalTerms().forEach(t => {
        const val = getResponse("definitions", "cult_" + t.id);
        answers += `<div class="summary-title">${escapeHtml(t.label)} — cultural reflection</div><p class="summary-body ${val ? "" : "empty"}">${escapeHtml(val || "Not answered yet.")}</p>`;
      });
    }
    if (!answers) return "";
    return `<div class="summary-block"><div class="badge">STEP ${step.n} — ${escapeHtml(step.title)}</div>${answers}</div>`;
  }).join("");

  return `
    <div class="step-meta">FINAL SCREEN</div>
    <h1 class="step-title">Review &amp; export</h1>
    <p class="step-intro">Currently framed for <strong>${escapeHtml(USE_CONTEXTS[state.useContext].name)}</strong>, running in ${escapeHtml(AUTHORITY_DEFS[state.authorityMode].name)} mode${state.lens !== "none" ? ", " + escapeHtml(LENS_DEFS[state.lens].name) + " lens" : ""}. The exported file records this configuration alongside your answers.</p>
    ${blocks}
    <div class="summary-block">
      <div class="badge">FRAMEWORK REFLECTION</div>
      <p class="prompt-hint">Where did your group's process depart from this 10-step structure — steps you cut, reordered, merged, or added — and why?</p>
      <textarea id="reflection-input" placeholder="...">${escapeHtml(state.reflection)}</textarea>
    </div>
    <div class="nav-row">
      <button class="secondary" onclick="goTo(${STEP_DEFS.length})">← Back to Step 10</button>
      <button class="primary" onclick="exportAnalysis()">Download .txt</button>
    </div>
  `;
}

function bindSummaryScreen() {
  document.getElementById("reflection-input").addEventListener("input", e => { state.reflection = e.target.value; saveState(); });
}

render();

/* ============================================================================
   HONESTY NOTE — what this actually took, and what's still soft
   ----------------------------------------------------------------------------
   1. The "Reflect on this answer" feedback is entirely heuristic (text
      length, line count) — not AI reading the content. It LOOKS like
      judgment; it isn't. A version that actually read student reasoning
      would need a live LLM call, which raises the same question the AI
      framing assist raises below: whose judgment is "directive" mode
      actually encoding? Adding AI doesn't answer that — it relocates it.

   2. The lens and context-of-use systems both work cleanly precisely
      BECAUSE they're shallow — short strings swapped per step. Either
      one having real teeth (e.g. a lens that actually changed which
      facts get flagged as "missing" in Step 3) would need much more
      interconnected logic than string-swapping, and would risk the two
      systems fighting each other in ways this file doesn't handle.

   3. The AI framing assist (item 5 above) is a genuine, working API call
      — not a mockup. But "the system prompt says don't invent facts or
      citations" is an instruction, not a guarantee: nothing in this file
      verifies the model actually complied on any given request. The UI
      compensates by requiring a manual "Insert into description" click
      rather than auto-filling, and by failing visibly (not silently)
      outside Claude.ai — but a real deployment would want more than a
      polite request to the model before treating this as reliable
      enough to hand to students without supervision.

   4. Three independent settings axes (4 authority modes × 4 lenses ×
      4 use-contexts = up to 64 combinations, before the "no lens"
      option) sounds like flexibility, but none of those combinations
      have been individually read through for whether the notes still
      make sense stacked together on one step. That's a real testing
      gap, not just a hypothetical one — worth a group actually clicking
      through a few unlikely combinations (e.g. Directive + Post-Incident
      + Individual Rights) before trusting this in front of students.

   5. Deliberately NOT built: any form of distress detection tied to the
      "save locally" / disclosure discussion. Not a time constraint — a
      decision that a fake version of that feature is worse than an
      honest absence of it.

   6. Step 7's gap detection (detectStep7Gaps) can tell you a field is
      EMPTY, SHORT, or that a word appears in one place and not another.
      It cannot tell you an answer is wrong, shallow-but-long, or
      internally inconsistent in a way that doesn't show up as a length
      or keyword signal. A student who pads every field with filler text
      will sail through every check here clean. That's a real ceiling on
      what heuristic gap-detection can do without an actual model reading
      the content — worth being direct with students about, not just
      with you.

   7. Step 5's cultural-term cards only exist for four terms
      (CULTURAL_TERM_BANK), detected by substring match. A case genuinely
      turning on a culturally loaded concept this bank doesn't cover
      (face, honor, filial duty, collectivized blame, whatever the case
      actually needs) gets nothing — not even the old generic pointer to
      the reference screen, since that box is gone now in favor of the
      cards. The general "terms" field is still there specifically to
      catch that gap, but nothing in the UI forces a student to notice
      they need it if the four watched terms all stayed silent. "No
      watched terms detected" reads reassuring; it isn't evidence there's
      nothing culturally loaded in the case, only that this particular
      four-term net didn't catch it.
============================================================================ */
</script>
